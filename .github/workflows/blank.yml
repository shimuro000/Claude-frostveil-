name: Build Frostveil

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find or unzip the project
        id: find
        run: |
          # 1) already unzipped somewhere?  2) otherwise unzip the zip that is in the repo
          SETTINGS=$(find . -maxdepth 4 -name settings.gradle -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No settings.gradle and no .zip found in the repository. Upload 'Frostveil src.zip' to the repo root."
              find . -maxdepth 3 -not -path "./.git/*" | head -50
              exit 1
            fi
            echo "Unzipping: $ZIP"
            mkdir -p _project
            unzip -q -o "$ZIP" -d _project
            SETTINGS=$(find _project -maxdepth 4 -name settings.gradle | head -n 1)
          fi
          if [ -z "$SETTINGS" ]; then
            echo "The zip does not contain settings.gradle"
            find _project -maxdepth 3 | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build jar
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: frostveil-jar
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
